<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>AMICY Bot World</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      (() => {
        const migrationKey = 'amicy.botworld.migration.v1'
        if (localStorage.getItem(migrationKey)) return
        try {
          const settingsKey = 'botcrossing.settings.v1'
          const settings = JSON.parse(localStorage.getItem(settingsKey) || '{}')
          settings.planet = 'terra'
          settings.timeOfDay = 0.42
          localStorage.setItem(settingsKey, JSON.stringify(settings))
          localStorage.setItem(migrationKey, '1')
        } catch {
          // The app still works if storage is unavailable; this only seeds the AMICY look once.
        }
      })()
    </script>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/amicy/bootstrap.js"></script>
  </body>
</html>
